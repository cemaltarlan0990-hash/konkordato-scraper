name: Gunluk konkordato taramasi

on:
  # PA bu tetiklemeyi gonderir: POST /repos/{owner}/{repo}/dispatches
  # Govde ornegi:
  #   {"event_type": "gunluk_tarama",
  #    "client_payload": {"geriye_donuk_gun": "5", "review_esigi": "0.80"}}
  # client_payload gonderilmezse asagidaki statik varsayilanlar kullanilir.
  repository_dispatch:
    types: [gunluk_tarama]

  # Actions sekmesi > Run workflow ile elle calistirma.
  # Kutulari bos birakirsan statik varsayilan devreye girer.
  workflow_dispatch:
    inputs:
      geriye_donuk_gun:
        description: 'Kac gun geriye bakilsin (0 = sadece bugun, 1 = bugun + dun)'
        required: false
        type: string
        default: ''
      review_esigi:
        description: 'Kismi eslesme esigi (0.75 = 3/4 ve ustu)'
        required: false
        type: string
        default: ''

# ---------------------------------------------------------------
# STATIK VARSAYILANLAR
# Kalici degisiklik icin sadece burayi duzenle.
# Elle calistirma ve PA client_payload bunlari gecici olarak ezer.
# ---------------------------------------------------------------
env:
  VARSAYILAN_GERIYE_DONUK_GUN: '1'
  VARSAYILAN_REVIEW_ESIGI: '0.75'

permissions:
  contents: write

concurrency:
  group: konkordato-tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Parametreleri coz
        id: parametre
        env:
          GIRDI_GUN: ${{ github.event.inputs.geriye_donuk_gun }}
          PAYLOAD_GUN: ${{ github.event.client_payload.geriye_donuk_gun }}
          GIRDI_ESIK: ${{ github.event.inputs.review_esigi }}
          PAYLOAD_ESIK: ${{ github.event.client_payload.review_esigi }}
        run: |
          # Oncelik: elle girdi > PA client_payload > statik varsayilan.
          # Bos string kontrolu bash'te yapiliyor; GitHub ifadelerindeki
          # || operatoru bos stringi guvenilir sekilde elemiyor.
          if [ -n "$GIRDI_GUN" ]; then
            gun="$GIRDI_GUN"; gun_kaynak="elle girdi"
          elif [ -n "$PAYLOAD_GUN" ]; then
            gun="$PAYLOAD_GUN"; gun_kaynak="PA client_payload"
          else
            gun="$VARSAYILAN_GERIYE_DONUK_GUN"; gun_kaynak="statik varsayilan"
          fi

          if [ -n "$GIRDI_ESIK" ]; then
            esik="$GIRDI_ESIK"; esik_kaynak="elle girdi"
          elif [ -n "$PAYLOAD_ESIK" ]; then
            esik="$PAYLOAD_ESIK"; esik_kaynak="PA client_payload"
          else
            esik="$VARSAYILAN_REVIEW_ESIGI"; esik_kaynak="statik varsayilan"
          fi

          # Bozuk deger sessizce varsayilana dusmemeli, calismayi durdurmali.
          case "$gun" in
            ''|*[!0-9]*)
              echo "HATA: geriye_donuk_gun tam sayi olmali, gelen: '$gun'"
              exit 1 ;;
          esac
          case "$esik" in
            ''|*[!0-9.]*|*.*.*)
              echo "HATA: review_esigi ondalik sayi olmali, gelen: '$esik'"
              exit 1 ;;
          esac

          echo "gun=$gun" >> "$GITHUB_OUTPUT"
          echo "esik=$esik" >> "$GITHUB_OUTPUT"

          echo "Tetikleyici       : ${{ github.event_name }}"
          echo "geriye_donuk_gun  : $gun  ($gun_kaynak)"
          echo "review_esigi      : $esik  ($esik_kaynak)"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testleri calistir
        run: python tests/test_suite.py

      - name: CRM referansini dogrula
        run: |
          if [ ! -f data/crm_referans.csv ]; then
            echo "HATA: data/crm_referans.csv bulunamadi."
            exit 1
          fi
          satir=$(wc -l < data/crm_referans.csv)
          echo "CRM referansi: $satir satir"
          if [ "$satir" -lt 10000 ]; then
            echo "HATA: CRM referansi beklenenden kucuk ($satir satir)."
            echo "Bozuk veriyle calismak sessiz yanlis sonuc uretir."
            exit 1
          fi

      - name: Taramayi calistir
        env:
          GERIYE_DONUK_GUN: ${{ steps.parametre.outputs.gun }}
          REVIEW_ESIGI: ${{ steps.parametre.outputs.esik }}
          CRM_YOLU: data/crm_referans.csv
          CIKTI_YOLU: cikti/eslesmeler.json
        run: python src/main.py

      - name: Sonucu commit et
        run: |
          git config user.name "konkordato-bot"
          git config user.email "actions@github.com"
          git add cikti/eslesmeler.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
            exit 0
          fi
          git commit -m "Tarama sonucu: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for deneme in 1 2 3; do
            if git push; then
              echo "Push basarili."
              exit 0
            fi
            echo "Push basarisiz (deneme $deneme), rebase edilip tekrar denenecek."
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "HATA: push uc denemede de basarisiz."
          exit 1

      - name: Ozeti yazdir
        if: always()
        run: |
          if [ -f cikti/eslesmeler.json ]; then
            python -c "import json,sys; d=json.load(open('cikti/eslesmeler.json',encoding='utf-8')); print('Ilan:',d.get('ilanSayisi'),'| Unvan:',d.get('toplamUnvan'),'| Ozet:',d.get('ozet'))"
          else
            echo "Cikti dosyasi uretilmedi."
          fi
