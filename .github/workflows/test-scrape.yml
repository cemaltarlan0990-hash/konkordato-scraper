name: Test Scrape

on:
  workflow_dispatch:        # elle tetikleme (test için kalsın)
  schedule:
    - cron: '30 6 * * *'   # her gün 9.30'da Türkiye saati

permissions:
  contents: write

concurrency:
  group: ilan-tarama
  cancel-in-progress: false

jobs:
  test-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run test script
        run: python test_scrape.py

      - name: Commit and push ilanlar.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ilanlar.json
          git diff --staged --quiet || git commit -m "Günlük ilan verisi güncellendi"
          git push
